services:
  mysql:
    image: mysql:8.4
    container_name: novamall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: novamall
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - novamall_mysql:/var/lib/mysql
      - ./backend/src/main/resources/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  novamall_mysql:
